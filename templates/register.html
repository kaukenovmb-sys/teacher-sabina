<!doctype html><html lang="kk"><head>{% include '_head.html' %}<title>StudyPlay — Тіркелу</title></head><body><main class="auth-page"><section class="auth-card glass"><a href="/" class="back">← Басты бет</a><div class="auth-logo">🎓</div><div class="eyebrow">ЖАҢА АККАУНТ</div><h1>Тіркелу</h1><p class="muted">Өзіңізге сәйкес режимді таңдаңыз.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="toast-inline {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post" class="stack-form" id="registerForm"><label>Аты-жөні<input name="name" autocomplete="name" placeholder="Мысалы: Сабина Нұрланқызы" required></label><label>Email<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label><div class="two-col"><label>Құпиясөз<input id="password" type="password" name="password" minlength="6" autocomplete="new-password" placeholder="Кемінде 6 таңба" required></label><label>Құпиясөзді қайталау<input id="password2" type="password" name="password2" minlength="6" autocomplete="new-password" placeholder="Қайта енгізіңіз" required></label></div><div><label>Рөл</label><div class="role-picker"><label><input type="radio" name="role" value="teacher" {% if request.args.get('role')=='teacher' %}checked{% endif %}><span>👨‍🏫<b>Мұғалім</b><small>Тапсырма және нәтиже</small></span></label><label><input type="radio" name="role" value="student" {% if request.args.get('role')!='teacher' %}checked{% endif %}><span>👨‍🎓<b>Оқушы</b><small>Ойын және XP</small></span></label></div></div><div id="regError" class="save-notice" role="alert"></div><button class="btn primary xl" type="submit">Аккаунт құру →</button></form><p class="auth-foot">Аккаунтыңыз бар ма? <a href="/login">Кіру</a></p></section></main><script src="/static/app.js"></script><script>document.getElementById('registerForm').addEventListener('submit',function(e){const p=document.getElementById('password'),p2=document.getElementById('password2'),box=document.getElementById('regError');box.textContent='';if(p.value.length<6){e.preventDefault();box.textContent='Құпиясөз кемінде 6 таңбадан тұруы керек';}else if(p.value!==p2.value){e.preventDefault();box.textContent='Құпиясөздер сәйкес келмейді';}});</script></body></html>
