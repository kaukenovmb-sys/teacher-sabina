<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Нәтижелер</title><link rel="stylesheet" href="/static/style.css"></head>
<body><nav><div class="logo">👩‍🏫 Teacher Sabina</div><a href="/admin" class="btn">← Артқа</a></nav><main class="container narrow"><h1>{{task.title}}</h1><p class="muted">Оқушылардың тапсырма нәтижелері</p><table><tr><th>#</th><th>Нәтиже</th><th>Уақыты</th></tr>{% for r in results %}<tr><td>{{loop.index}}</td><td><strong>{{r.score}} / {{r.total}}</strong></td><td>{{r.created_at}}</td></tr>{% else %}<tr><td colspan="3">Әзірге нәтиже жоқ.</td></tr>{% endfor %}</table></main></body></html>
