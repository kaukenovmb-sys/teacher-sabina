<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{task.title}}</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="student"><div class="studenthead"><div class="logo">🧩 MatchLab</div><h1>{{task.title}}</h1><p>Сәйкес карточкаларды қосыңыз.</p></div>
<div class="board" id="board"><svg id="lines"></svg><div id="left" class="col">{% for p in pairs %}<button class="card left" data-id="{{p.id}}">{{p.left}}</button>{% endfor %}</div><div id="right" class="col">{% for p in pairs|sort(attribute='right_text') %}<button class="card right" data-value="{{p.right_text}}">{{p.right_text}}</button>{% endfor %}</div></div>
<div class="center"><button class="btn primary" onclick="check()">Тексеру</button><button class="btn" onclick="location.reload()">Қайта бастау</button><div id="result"></div></div></main>
<script>
let selectedLeft=null,selectedRight=null,answers={};
const board=document.getElementById('board');
function L(c){document.querySelectorAll('.left').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');selectedLeft=c;if(selectedRight)connect()}
function R(c){document.querySelectorAll('.right').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');selectedRight=c;if(selectedLeft)connect()}
function connect(){answers[selectedLeft.dataset.id]=selectedRight.dataset.value;selectedLeft.classList.remove('selected');selectedRight.classList.remove('selected');selectedLeft=selectedRight=null;draw()}
document.querySelectorAll('.left').forEach(c=>c.onclick=()=>L(c));document.querySelectorAll('.right').forEach(c=>c.onclick=()=>R(c));
function draw(){let s=document.getElementById('lines');s.innerHTML='';Object.entries(answers).forEach(([id,val],i)=>{let a=document.querySelector(`.left[data-id="${id}"]`),b=[...document.querySelectorAll('.right')].find(x=>x.dataset.value===val);if(!a||!b)return;let A=a.getBoundingClientRect(),B=b.getBoundingClientRect(),C=board.getBoundingClientRect(),l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',A.right-C.left);l.setAttribute('y1',A.top+A.height/2-C.top);l.setAttribute('x2',B.left-C.left);l.setAttribute('y2',B.top+B.height/2-C.top);l.setAttribute('stroke',['#df91c5','#8e84db','#e8cb62','#e18484','#75b8d0','#a77fd0'][i%6]);l.setAttribute('stroke-width','6');l.setAttribute('stroke-linecap','round');s.appendChild(l)})}
async function check(){let r=await fetch(location.pathname+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers})});let d=await r.json();document.getElementById('result').textContent=`Нәтиже: ${d.score}/${d.total} ${d.score===d.total?'🎉 Барлығы дұрыс!':''}`;Object.keys(answers).forEach(id=>{let a=document.querySelector(`.left[data-id="${id}"]`),b=[...document.querySelectorAll('.right')].find(x=>x.dataset.value===answers[id]);let correct=b&&[...document.querySelectorAll('.right')].some(x=>x.dataset.value===answers[id]);a.classList.add('checked');})}
window.onresize=draw;
</script></body></html>
